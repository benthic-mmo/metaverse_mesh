[package]
name = "metaverse_mesh"
version = "0.3.3"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "mesh handling for the open metaverse"
license = "AGPL-3.0-or-later"
homepage= "https://benthic-mmo.github.io/"
repository = "https://github.com/benthic-mmo/metaverse_mesh"
edition = "2024"

exclude = [
    "tests/assets/**",
    "tests/**",
]

[features]
default = []
ktx2 = ["dep:ktx-rs"]
glb = []
dxt1 = ["dep:ktx-rs", "dep:texture-compressor"]

[dependencies]
benthic_default_asset_converter = {path="../metaverse_client/crates/default_asset_converter/", features=["animations"]}
benthic_protocol = {path="../metaverse_client/crates/benthic_protocol/"}
texture-compressor = { version = "0.2.4", optional = true }
glam = "0.32.1"
gltf-json = { version = "1.4.1", features = ["KHR_texture_transform", "extensions"] }
gltf = { version = "1.4.1", features = ["KHR_texture_transform", "extensions"] }
rgb = "0.8.53"
serde_json = "1.0.150"
regex = "1.12.4"
indexmap = "2.14.2"
thiserror = "2.0.20"
image = "0.25.10"
ktx-rs = {version="4.4.3", optional=true}

[dev-dependencies]
bevy = "0.19.0"
lazy_static = "1.5.0"
bevy_world_serialization = "0.19.0"
bevy_panorbit_camera = "0.35.0"
